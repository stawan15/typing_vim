# fly.toml app configuration
# Generated for Phoenix typing_vim project.
# Run `fly launch --copy-config` to set app name + region, or edit below.

app = "typing-vim"
primary_region = "sin"   # Singapore — change with `fly regions set <code>`
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]

[env]
  PHX_HOST = "typing-vim.fly.dev"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 800

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
